<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Dar Lustan</title>
    <link rel="stylesheet" href="login.css">
    <script src="cadastro.js" defer></script>
</head>
<body>
    <main>
        <a href="index.html" aria-label="Voltar ao início">
            <img class="logo" src="images/Dar-LusatnLogo+nome.png" alt="Dar Lustan">
        </a>
        <form id="formularioLogin">
            <h1>Entrar na conta</h1>
            <label for="emailLogin">E-mail</label>
            <input type="email" id="emailLogin" name="email" autocomplete="username" placeholder="seu@email.com" required>
            <label for="senhaLogin">Senha</label>
            <input type="password" id="senhaLogin" name="senha" autocomplete="current-password" placeholder="Digite sua senha" required>
            <p id="mensagemLogin" role="alert"></p>
            <button type="submit">Entrar</button>
            <p>Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </form>
        <section id="contaLogada" hidden>
            <h1>Minha conta</h1>
            <p>Olá, <strong id="nomeUsuario"></strong>! Você está conectado.</p>
            <p><a href="cardapio.html">Ver cardápio</a></p>
            <button type="button" id="botaoSair">Sair da conta</button>
        </section>
        <a class="voltar" href="index.html">Voltar ao início</a>
    </main>
</body>
</html>
