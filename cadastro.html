<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar</title>
    <link rel="stylesheet" href="SignIn.css">
</head>
<body>
    <main>
        <form action="cadastrar" method="post" id="formularioCadastro">
            <div id="darLustanLogo"></div>
            <div id="inputNome">
                <input type="text" name="NomeCompleto" id="nomeInput" class="inputTexto" placeholder="Nome completo">
            </div>
            <div id="inputEmail">
                <input type="email" name="EmailUsuario" id="Emailinput" class="inputTexto" placeholder="Email">
            </div>
            <div id="inputSenha">
                <input type="password" name="PasswordUsuario" id="PasswordInput" class="inputTexto" placeholder="Senha">
            </div>
            <div id="inputTelefone">
                <input type="text" name="UserTelNumber" id="TelInput"  class="inputTexto"placeholder="Número de telefone" oninput="MascaraTelefone()">
            </div>
            <div id="inputEndereco">
                <input type="text" name="UserAdress" id="AdressInput" class="inputTexto" placeholder="Endereço">
            </div>
            <div id="inputUserType">
                <input type="radio" name="UserType" id="RadioUser" value="NormarUser"> Cliente
                <input type="radio" name="UserType" id="RadioPartner" value="DeliveryPartner"> Entregador
            </div>
            <div id="inputDriverDados">              
            </div>
            <div id="botaoCadastrar">
                <button type="submit">Cadastrar</button>
            </div>
        </form>
    </main>
</body>
<script src="cadastro.js"></script>
</html>
